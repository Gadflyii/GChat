[package]
name = "tauri-plugin-ginfer"
version = "0.1.0"
authors = ["Jan <service@jan.ai>"]
description = "Tauri plugin for managing GInfer server processes and model loading"
license = "MIT"
repository = "https://github.com/SectileLabs/gchat"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-ginfer"

[dependencies]
ginfer-host = { path = "../../ginfer-host" }
hyper = { version = "0.14", features = ["full"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.5.0", default-features = false, features = [] }
thiserror = "2.0.12"
tokio = { version = "1", features = ["full"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.11", features = ["json", "blocking", "stream", "native-tls"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.11", features = ["json", "blocking", "stream", "rustls-tls"], default-features = false }

[build-dependencies]
tauri-plugin = { version = "2.3.1", features = ["build"] }

[dev-dependencies]
tempfile = "3"
