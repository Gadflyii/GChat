[workspace]
resolver = "2"
members = ["crates/cua-proto", "crates/cua-spacesd-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["trycua"]
license = "MIT"
repository = "https://github.com/trycua/cua"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", default-features = false }
tonic-web = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
pbjson = "0.9"
pbjson-types = "0.9"
pbjson-build = "0.9"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots", "tls12", "logging"] }
tower = { version = "0.5", features = ["util"] }
tokio-stream = "0.1"
futures-util = "0.3"
bytes = "1"
url = "2.5"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
base64 = "0.22"
hex = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
cua-proto = { path = "crates/cua-proto" }
