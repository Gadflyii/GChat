[package]
name = "gbot-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "GChat's local-first bot workspace service"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
keyring = { version = "3.6", features = ["windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
clap = { version = "4", features = ["derive"] }
russh = { version = "=0.63.1", default-features = false, features = ["ring", "rsa"] }

[dev-dependencies]
tempfile = "3"
